<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Zeno</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:           #080808;
      --surface:      #111111;
      --border:       #1f1f1f;
      --accent:       #ffffff;
      --accent-glow:  rgba(255, 255, 255, 0.12);
      --text:         #f0f0f0;
      --muted:        #555555;
      --subtle:       #2a2a2a;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    /* ── Background orb ── */
    .bg-orb {
      position: fixed;
      top: -260px;
      left: 50%;
      translate: -50% 0;
      width: 800px;
      height: 800px;
      background: radial-gradient(circle, rgba(255,255,255,0.055) 0%, transparent 68%);
      pointer-events: none;
      animation: orb-breathe 7s ease-in-out infinite;
    }
    @keyframes orb-breathe {
      0%,100% { opacity: .7; scale: 1;    }
      50%      { opacity: 1;  scale: 1.12; }
    }

    /* ── Header ── */
    header {
      width: 100%;
      padding: 22px 40px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 1;
    }
    .logo {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: .1em;
    }

    /* ── Main ── */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 90px 24px 80px;
      position: relative;
      z-index: 1;
    }

    /* Single orchestrated entrance */
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      animation: hero-rise .75s cubic-bezier(0.16,1,.3,1) both;
    }
    @keyframes hero-rise {
      from { opacity: 0; translate: 0 22px; }
      to   { opacity: 1; translate: 0  0;   }
    }

    /* Badge */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 5px 13px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 30px;
    }
    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #e0e0e0;
      box-shadow: 0 0 7px rgba(255,255,255,0.5);
      animation: dot-blink 2.4s ease-in-out infinite;
    }
    @keyframes dot-blink {
      0%,100% { opacity: 1; }
      50%      { opacity: .25; }
    }

    /* Heading */
    h1 {
      font-size: clamp(40px, 7vw, 68px);
      font-weight: 700;
      letter-spacing: -.035em;
      line-height: 1.08;
      color: #ffffff;
      margin-bottom: 18px;
    }
    .subtitle {
      font-size: 16px;
      line-height: 1.65;
      color: var(--muted);
      max-width: 360px;
      margin-bottom: 52px;
    }

    /* ── Download button ── */
    .download-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 11px;
      padding: 15px 34px;
      background: #ffffff;
      color: #080808;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      border-radius: 11px;
      border: none;
      cursor: pointer;
      overflow: hidden;
      transition:
        background  .2s ease,
        translate   .18s ease,
        box-shadow  .2s ease;
      box-shadow:
        0 0 0 0 var(--accent-glow),
        0 4px 18px rgba(255,255,255,0.10);
    }
    /* shimmer sweep */
    .download-btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        108deg,
        transparent 38%,
        rgba(0,0,0,0.10) 50%,
        transparent 62%
      );
      translate: -120% 0;
    }
    .download-btn:hover {
      background: #e8e8e8;
      translate: 0 -2px;
      box-shadow:
        0 0 0 5px var(--accent-glow),
        0 8px 28px rgba(255,255,255,0.14);
    }
    .download-btn:hover::after {
      translate: 120% 0;
      transition: translate .55s ease;
    }
    .download-btn:active {
      translate: 0 0;
      transition-duration: .08s;
    }

    .btn-icon {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      opacity: .85;
    }

    /* File metadata */
    .file-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 18px;
      font-size: 12px;
      color: var(--muted);
    }
    .meta-sep {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--subtle);
      flex-shrink: 0;
    }

    /* ── Footer ── */
    footer {
      width: 100%;
      padding: 22px 24px;
      border-top: 1px solid var(--border);
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      position: relative;
      z-index: 1;
    }

    /* ── Reduced motion ── */
    @media (prefers-reduced-motion: reduce) {
      .hero      { animation: none; }
      .bg-orb    { animation: none; }
      .badge-dot { animation: none; }
      .download-btn::after { display: none; }
    }

    @media (max-width: 480px) {
      header { padding: 18px 20px; }
      main   { padding: 64px 20px 60px; }
    }
  </style>
</head>
<body>

  <div class="bg-orb"></div>

  <header>
    <div class="logo">Zeno</div>
  </header>

  <main>
    <div class="hero">

      <div class="badge">
        <span class="badge-dot"></span>
        Version 1.0 available
      </div>

      <h1>Zeno</h1>

      <p class="subtitle">
        A lightweight Windows app. Download, install, and get started in seconds.
      </p>

      <a class="download-btn"
         href="https://github.com/zeno1011/zeno1011-github.io/releases/download/v1.0/rat.exe"
         download>
        <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
          <path d="M0 3.449L9.75 2.1v9.45H0m10.949-9.602L24 0v11.4H10.949M0 12.6h9.75v9.451L0 20.699M10.949 12.6H24V24l-12.9-1.801"/>
        </svg>
        Download for Windows
      </a>

      <div class="file-meta">
        <span>v1.0</span>
        <span class="meta-sep"></span>
        <span>Windows 10 / 11</span>
        <span class="meta-sep"></span>
        <span>.exe installer</span>
      </div>

    </div>
  </main>

  <footer>
    © 2026 Zeno. All rights reserved.
  </footer>

</body>
</html>
